name: Enrich Manual Analysis

on:
  push:
    branches: [main]
    paths: ['analysis-manual.json']
  workflow_dispatch:

# Writes status.json like the other data workflows, so it shares their group
# and never runs at the same time as them (a queued run waits).
concurrency:
  group: data-json-writers
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix scripts

      - name: Summarise entries without a description
        env:
          MID_TERMS_AC: ${{ secrets.MID_TERMS_AC }}   # Analysis & Commentary tab AI
        run: node scripts/enrich-manual.js

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis-manual.json status.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): AI summaries for manual analysis entries [skip ci]"
          # Rebase onto anything pushed since checkout, then push; retry on a race
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push after 3 attempts"
          exit 1
