name: Fetch Candidate News

on:
  schedule:
    - cron: '29 */6 * * *'   # every 6 hours, off-peak minute
  workflow_dispatch:

# Writes status.json like the other data workflows, so it shares their group
# and never runs at the same time as them (a queued run waits).
concurrency:
  group: data-json-writers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix scripts

      - name: Fetch candidate news
        run: node scripts/fetch-candidate-news.js

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/candidate-news.json status.json
          if git diff --cached --quiet; then
            echo "No candidate news changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): update candidate news [skip ci]"
          # Rebase onto anything pushed since checkout, then push; retry on a race
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push after 3 attempts"
          exit 1

      - name: Fail if a primary source has been down for over 48 hours
        run: node scripts/check-status.js candidates
