name: Live results (Fox News, AP, NBC News)

# Election-night results from three decision desks: Fox News (scripts/live-from-fox.js),
# then AP and NBC News (scripts/live-desks.js). A seat counts when two desks agree. Starts every hour and loops for 58 minutes,
# fetching every 3 minutes; commits assets/live.json only when it changed. The same
# loop refreshes data/litigation.json (scripts/litigation.js) and the cross-check of calls
# against the source sheet's outlets, the FT and Ground News (scripts/live-sources.js).
# Its own concurrency group, so it never queues behind the data jobs.
# GitHub drops hourly scheduled runs under load (4 Nov: the 12:58 and 13:58 UTC runs never
# started). Two guards: the cron fires every 10 minutes (a trigger while a run is going just
# waits as the single pending run), and each run dispatches the next one when it ends.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: live-results-fox
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install feed-reader dependencies (litigation tracker)
        run: npm ci --prefix scripts
      - name: Fox results every 3 minutes for 56 minutes
        env:
          LIVE_COMMIT_CMD: >-
            (node scripts/live-desks.js || true) &&
            (node scripts/litigation.js || true) &&
            (node scripts/live-sources.js || true) &&
            git add assets/live.json data/litigation.json data/live-sources.json &&
            (git diff --cached --quiet || (git commit -q -m "chore(live): Fox results [skip ci]" &&
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done))
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          node scripts/live-from-fox.js --loop 56
      - name: Start the next run (keeps the loop going if a scheduled run is dropped)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-results.yml --ref main || true
