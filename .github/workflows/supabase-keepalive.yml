name: Supabase keep-alive

# Free Supabase projects pause after a week without requests. One small read a
# week keeps the comments database awake. Needs the repo secret SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from comments_public
        env:
          SUPABASE_URL: https://zxwrecjvhmoceyfsarwz.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repo secret SUPABASE_ANON_KEY is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/comments_public?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/out.json
            exit 1
          fi
