<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis & Commentary — US 2026 Mid-term Election Racebook</title>
<meta name="description" content="Analysis and commentary on the 2026 US midterm elections from researchers at the Takshashila Institution's Geostrategy Programme — long-form explainers, forecasts, and strategic assessments.">
<meta name="keywords" content="US midterms analysis 2026, Takshashila geostrategy, US elections commentary, DC Dossier, Abhishek Kadiyala, Brigadier Anil Raman">
<meta name="author" content="Takshashila Institution Geostrategy Programme">
<meta property="og:title" content="Analysis & Commentary — US 2026 Mid-term Election Racebook">
<meta property="og:description" content="Analysis and commentary on the 2026 US midterms from Takshashila Institution's Geostrategy Programme.">
<meta property="og:image" content="https://dcdossier.github.io/Generational-Mid-terms/assets/Mid-term-logo.png">
<meta property="og:url" content="https://dcdossier.github.io/Generational-Mid-terms/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Analysis & Commentary — US 2026 Mid-term Election Racebook">
<meta name="twitter:description" content="Analysis and commentary on the 2026 US midterms from Takshashila Institution's Geostrategy Programme.">
<meta name="twitter:image" content="https://dcdossier.github.io/Generational-Mid-terms/assets/Mid-term-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --beige: #F5F0DC;
  --beige-lt: #FBF8EE;
  --navy: #1A3F8A;
  --navy-dk: #122C61;
  --coral: #FF6F59;
  --coral-dk: #E0543F;
  --ink: #20242B;
  --ink-soft: #5B5F66;
  --border: #E4DEC9;
  --gold: #f1a222;
  --brand: #620d3c;            /* site sub-nav accent, shared with other pages */
  --serif: 'Times New Roman', Georgia, serif;
  --sans: 'Inter', 'Lato', ui-sans-serif, system-ui, sans-serif;
  --card-w: 280px;
  --gap: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* SUB-NAV (unchanged from the previous layout) */
.sub-nav {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.sub-tab {
  font: 600 15px var(--sans);
  color: var(--brand);
  background: none;
  border: none;
  border-bottom: 2px solid var(--gold);
  padding: 16px 18px;
}
.nav-spacer { flex: 1; }
.last-updated { font-size: 13px; color: var(--ink-soft); padding-left: 14px; white-space: nowrap; }

/* PAGE */
.ac-page {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px 28px 56px;
}
.ac-intro {
  font: 400 15px/1.6 var(--sans);
  color: var(--ink-soft);
  margin-bottom: 18px;
}

/* AUTHOR FILTER */
.ac-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}
.ac-filter button {
  font: 500 14px var(--sans);
  color: var(--navy);
  background: var(--bg);
  border: 1px solid var(--navy);
  border-radius: 999px;
  padding: 7px 16px;
  cursor: pointer;
}
.ac-filter button:hover { background: var(--beige-lt); }
.ac-filter button[aria-pressed="true"] { background: var(--navy); color: #fff; }

/* SECTIONS */
.ac-section {
  --accent: var(--coral);        /* card top border and title marker */
  scroll-margin-top: 64px;       /* clear the sticky sub-nav when scrolled to */
  background: var(--beige-lt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 20px 20px;
  margin-bottom: 24px;
}
.ac-section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.ac-section-title {
  font: 700 22px var(--serif);
  color: var(--navy);
}
.ac-section-title::before {
  content: '';
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: 2px;
}
.ac-section[data-section="newsletter"] { --accent: var(--navy); }
.ac-explore {
  font: 600 14px var(--sans);
  color: var(--coral-dk);
  background: none;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  padding: 2px 0;
}
.ac-explore:hover { text-decoration: underline; text-underline-offset: 3px; }
.ac-empty {
  font: italic 400 14px var(--sans);
  color: var(--ink-soft);
  padding: 10px 0;
}

/* CAROUSEL */
.ac-carousel { position: relative; }
.ac-track {
  display: flex;
  gap: var(--gap);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 4px 2px 6px;          /* room for the focus outline */
}
.ac-track::-webkit-scrollbar { display: none; }
.ac-track > .ac-card {
  flex: 0 0 var(--card-w);
  scroll-snap-align: start;
}
.ac-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--navy);
  font: 700 18px var(--sans);
  line-height: 1;
  box-shadow: 0 2px 8px rgba(20, 20, 30, .15);
  cursor: pointer;
  z-index: 2;
}
.ac-arrow:hover { background: var(--beige); }
.ac-arrow.prev { left: -14px; }
.ac-arrow.next { right: -14px; }
.ac-arrow[hidden] { display: none; }

/* EXPANDED GRID */
.ac-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--gap);
  padding: 4px 2px 6px;
}

/* CARD */
.ac-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 210px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-top: 3px solid var(--accent, var(--coral));
  border-radius: 8px;
  padding: 14px 16px 12px;
  color: var(--ink);
  text-decoration: none;
  overflow: hidden;
}
/* Images: a strip across the top (op-ed, media, podcast) or a round logo
   beside the title (newsletter). Removed on load error, leaving the card as it
   is without one. */
.ac-img-strip {
  display: block;
  width: calc(100% + 32px);
  max-width: none;
  height: 100px;
  margin: -14px -16px 12px;
  object-fit: cover;
  border-radius: 5px 5px 0 0;
}
.ac-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.ac-logo {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
}
.ac-card:focus { outline: none; }
.ac-card:focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 2px;
}
.ac-title {
  font: 700 17px/1.3 var(--serif);
  color: var(--navy);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}
.ac-authors {
  font: 500 13px/1.4 var(--sans);
  color: var(--ink);
  margin-bottom: 4px;
}
.ac-meta {
  font: 400 12.5px/1.4 var(--sans);
  color: var(--ink-soft);
}
.ac-more {
  margin-top: auto;
  padding-top: 12px;
  font: 600 13px var(--sans);
  color: var(--coral-dk);
}
.ac-summary {
  font: 400 13.5px/1.5 var(--sans);
  color: var(--ink);
}

/* Summary: an overlay on hover/focus where hovering is possible … */
@media (hover: hover) {
  .ac-summary {
    position: absolute;
    inset: 0;
    background: var(--bg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity .15s;
    pointer-events: none;
  }
  .ac-summary-text {
    display: -webkit-box;
    -webkit-line-clamp: 7;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ac-summary .ac-more { display: block; }
  .ac-card:hover .ac-summary,
  .ac-card:focus-visible .ac-summary { opacity: 1; }
  .ac-card:not(.has-summary) .ac-summary { display: none; }
}
/* … and two lines under the title on touch screens */
@media (hover: none) {
  .ac-summary { order: 1; margin-bottom: 8px; }
  .ac-summary-text {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ac-summary .ac-more { display: none; }
  .ac-img-strip { order: -1; }
  .ac-title, .ac-head { order: 0; }
  .ac-authors { order: 2; }
  .ac-meta { order: 3; }
  .ac-card > .ac-more { order: 4; }
}

.ac-loading { font: 400 15px var(--sans); color: var(--ink-soft); padding: 24px 0; }

@media (max-width: 640px) {
  .sub-nav { padding: 0 16px; }
  .ac-page { padding: 18px 16px 40px; }
  .ac-section { padding: 16px 14px 18px; }
  .ac-section-title { font-size: 20px; }
  /* 1.2 cards visible, so the next one peeks */
  .ac-track > .ac-card { flex-basis: calc((100% - var(--gap)) / 1.2); }
  .ac-grid { grid-template-columns: 1fr; }
  .ac-arrow { display: none; }
}
</style>
</head>
<body>

<!-- SUB-NAV -->
<nav class="sub-nav">
  <span class="sub-tab">Analysis &amp; Commentary</span>
  <div class="nav-spacer"></div>
  <span class="last-updated" id="lastUpdated"></span>
</nav>

<main class="ac-page">
  <p class="ac-intro">Writing, research and media appearances on the 2026 US mid-terms by researchers at the Takshashila Institution.</p>

  <div class="ac-filter" role="group" aria-label="Filter by author">
    <button type="button" data-author="all" aria-pressed="true">All</button>
    <button type="button" data-author="abhishek" aria-pressed="false">Abhishek Kadiyala</button>
    <button type="button" data-author="anil" aria-pressed="false">Brigadier Anil Raman</button>
  </div>

  <div id="ac-sections"><p class="ac-loading">Loading analysis &amp; commentary…</p></div>
</main>

<script>
'use strict';

// ── CATEGORIES & AUTHORS ─────────────────────────────────────────────────────
const SECTIONS = [
  { key: 'oped',       title: 'Op-eds',             types: ['op-ed', 'blog'] },
  { key: 'newsletter', title: 'Newsletters',        types: ['newsletter'] },
  { key: 'research',   title: 'Research Documents', types: ['research'] },
  { key: 'media',    title: 'Media/In-News',      types: ['media', 'interview'] },
  { key: 'podcast',  title: 'Podcasts',           types: ['podcast'] },
];
const CAROUSEL_SIZE = 6;
// A card matches if its author field contains the name (co-authored pieces show under both)
const AUTHORS = {
  all:      null,
  abhishek: 'Abhishek Kadiyala',
  anil:     'Anil Raman',
};

let _allPosts = [];
let _author = 'all';
let _expanded = null;              // key of the one expanded section, or null

// ── LOAD DATA ────────────────────────────────────────────────────────────────
// analysis-manual.json is the only source ("entries", plus "posts" for safety).
// Entries are de-duplicated by URL (first one wins) and sorted newest first.
// analysis.json is kept in the repo as a frozen backup and is not read.

async function fetchJson(name) {
  for (const p of [name, './' + name, '../' + name]) {
    try {
      const r = await fetch(p + '?t=' + Date.now());
      if (r.ok) return await r.json();
    } catch (e) { /* try next */ }
  }
  return null;
}

// Input page types are op-ed, newsletter, research, media and podcast; older
// names ("Research Paper", "Tweet/Post") are mapped as well.
const MANUAL_TYPES = {
  'newsletter': 'newsletter', 'op-ed': 'op-ed', 'podcast': 'podcast',
  'research paper': 'research', 'research': 'research', 'blog': 'blog',
  'media': 'media', 'interview': 'media', 'tweet/post': 'media', 'video': 'media',
};

// Readable stand-in title from the link's last path segment, e.g.
// ".../p/26-institutional-mistrust" → "26 institutional mistrust"
function titleFromUrl(u, host) {
  try {
    const seg = new URL(u).pathname.split('/').filter(Boolean).pop() || '';
    const words = decodeURIComponent(seg).replace(/\.[a-z]{2,5}$/i, '').replace(/[-_]+/g, ' ').trim();
    if (words && !/^\d+$/.test(words) && words.length > 3) return words.charAt(0).toUpperCase() + words.slice(1);
  } catch (err) { /* fall through */ }
  return host ? 'Article on ' + host : String(u || '');
}

function normaliseManual(e, i) {
  let host = '';
  try { host = new URL(e.url).hostname.replace(/^www\./, ''); } catch (err) { /* keep empty */ }
  // Fallbacks while the enrichment job has not filled an entry in yet:
  // title from the link, date from when the entry was added
  const hasDate = e.date && !isNaN(new Date(e.date));
  return {
    id: e.id || 'manual-' + i,
    type: MANUAL_TYPES[String(e.type || '').toLowerCase()] || String(e.type || 'research').toLowerCase(),
    title: String(e.title || '').trim() || titleFromUrl(e.url, host),
    description: e.description || '',
    url: e.url,
    source: e.source || host,
    date: hasDate ? e.date : (e.added_at || ''),
    author: e.author || '',
    ai_summary: !!e.ai_summary,
    image: String(e.image || '').trim(),
  };
}

// Merge key: host + path + query without tracking parameters or #fragment.
// The query is kept (YouTube episodes differ only by ?v=…) with its case.
function urlKey(u) {
  try {
    const x = new URL(String(u || '').trim());
    // Tracking and share parameters: Spotify/YouTube "si", Substack's referral "r"
    const host = x.hostname.replace(/^www\./, '');
    [...x.searchParams.keys()].forEach(k => {
      if (/^(utm_|fbclid$|gclid$|ref$|ref_src$|si$)/.test(k) || (k === 'r' && /substack\.com$/.test(host))) x.searchParams.delete(k);
    });
    return (x.hostname.replace(/^www\./, '') + x.pathname.replace(/\/$/, '')).toLowerCase() + x.search;
  } catch (e) {
    return String(u || '').trim().toLowerCase();
  }
}

async function loadData() {
  const manual = await fetchJson('analysis-manual.json');
  const list = Array.isArray(manual) ? manual
    : [...((manual && manual.entries) || []), ...((manual && manual.posts) || [])];

  const byUrl = new Map();
  list.filter(e => e && e.url).map(normaliseManual)
    .forEach(p => { if (!byUrl.has(urlKey(p.url))) byUrl.set(urlKey(p.url), p); });
  const t = p => new Date(p.date).getTime() || 0;   // undated entries sort last
  _allPosts = [...byUrl.values()].sort((a, b) => t(b) - t(a));

  const stamps = [manual && manual.meta && manual.meta.last_updated].filter(Boolean);
  if (stamps.length) {
    const dt = new Date(stamps.sort().pop());
    document.getElementById('lastUpdated').textContent =
      'Updated ' + dt.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  readHash();
  render();
}

// ── FILTERING ────────────────────────────────────────────────────────────────
function postsFor(section, applyAuthor) {
  const name = applyAuthor ? AUTHORS[_author] : null;
  return _allPosts.filter(p =>
    section.types.includes(p.type) &&
    (!name || String(p.author || '').toLowerCase().includes(name.toLowerCase())));
}

function readHash() {
  const m = location.hash.match(/author=([a-z]+)/);
  _author = m && AUTHORS.hasOwnProperty(m[1]) ? m[1] : 'all';
  document.querySelectorAll('.ac-filter button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.author === _author)));
}

function setAuthor(key) {
  _author = key;
  history.replaceState(null, '', key === 'all' ? location.pathname + location.search : '#author=' + key);
  readHash();
  render();
}

// ── RENDERING ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Decorative (the title describes the card); removed if it fails to load
const STRIP_TYPES = ['op-ed', 'blog', 'media', 'interview', 'podcast'];
function cardImg(p, cls) {
  return `<img class="${cls}" src="${esc(p.image)}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.remove()">`;
}

function cardHtml(p) {
  const meta = [p.source, fmtDate(p.date)].filter(Boolean).join(' · ');
  const summary = String(p.description || '').trim();
  const strip = p.image && STRIP_TYPES.includes(p.type);
  const logo = p.image && p.type === 'newsletter';
  const title = `<h3 class="ac-title">${esc(p.title)}</h3>`;
  return `<a class="ac-card${summary ? ' has-summary' : ''}" href="${esc(p.url)}" target="_blank" rel="noopener">
    ${strip ? cardImg(p, 'ac-img-strip') : ''}
    ${logo ? `<div class="ac-head">${cardImg(p, 'ac-logo')}${title}</div>` : title}
    ${p.author ? `<div class="ac-authors">${esc(p.author)}</div>` : ''}
    ${meta ? `<div class="ac-meta">${esc(meta)}</div>` : ''}
    ${summary ? `<div class="ac-summary"><span class="ac-summary-text">${esc(summary)}</span><span class="ac-more">Read more →</span></div>` : ''}
    <span class="ac-more" aria-hidden="true">Read more →</span>
  </a>`;
}

function render() {
  const root = document.getElementById('ac-sections');
  const visible = SECTIONS.filter(s => postsFor(s, false).length);   // hide categories with no entries at all
  if (_expanded && !visible.some(s => s.key === _expanded)) _expanded = null;
  if (!visible.length) { root.innerHTML = '<p class="ac-empty">No entries yet</p>'; return; }

  root.innerHTML = visible.map(s => {
    const posts = postsFor(s, true);
    const expanded = _expanded === s.key;
    let body;
    if (!posts.length) {
      body = '<p class="ac-empty">No entries yet</p>';
    } else if (expanded) {
      body = `<div class="ac-grid" id="ac-body-${s.key}">${posts.map(cardHtml).join('')}</div>`;
    } else {
      body = `<div class="ac-carousel">
        <button type="button" class="ac-arrow prev" aria-label="Previous ${esc(s.title)}" hidden>‹</button>
        <div class="ac-track" id="ac-body-${s.key}">${posts.slice(0, CAROUSEL_SIZE).map(cardHtml).join('')}</div>
        <button type="button" class="ac-arrow next" aria-label="Next ${esc(s.title)}" hidden>›</button>
      </div>`;
    }
    const explore = posts.length
      ? `<button type="button" class="ac-explore" data-section="${s.key}" aria-expanded="${expanded}" aria-controls="ac-body-${s.key}">${expanded ? 'Show less ↑' : 'Explore all →'}</button>`
      : '';
    return `<section class="ac-section" data-section="${s.key}" aria-labelledby="ac-h-${s.key}">
      <div class="ac-section-head">
        <h2 class="ac-section-title" id="ac-h-${s.key}">${esc(s.title)}</h2>
        ${explore}
      </div>
      ${body}
    </section>`;
  }).join('');

  root.querySelectorAll('.ac-carousel').forEach(initCarousel);
}

// ── CAROUSEL ─────────────────────────────────────────────────────────────────
function initCarousel(el) {
  const track = el.querySelector('.ac-track');
  const prev = el.querySelector('.ac-arrow.prev');
  const next = el.querySelector('.ac-arrow.next');
  const step = () => {
    const card = track.querySelector('.ac-card');
    return card ? card.getBoundingClientRect().width + parseFloat(getComputedStyle(track).columnGap || 16) : track.clientWidth;
  };
  const update = () => {
    prev.hidden = track.scrollLeft <= 2;
    next.hidden = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;
  };
  prev.addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));
  next.addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));
  track.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
document.querySelector('.ac-filter').addEventListener('click', e => {
  const b = e.target.closest('button[data-author]');
  if (b) setAuthor(b.dataset.author);
});

document.getElementById('ac-sections').addEventListener('click', e => {
  const b = e.target.closest('.ac-explore');
  if (!b) return;
  const key = b.dataset.section;
  _expanded = _expanded === key ? null : key;      // only one section expanded at a time
  render();
  const sec = document.querySelector(`.ac-section[data-section="${key}"]`);
  if (sec) {
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const btn = sec.querySelector('.ac-explore');
    if (btn) btn.focus({ preventScroll: true });
  }
});

window.addEventListener('hashchange', () => { readHash(); render(); });

loadData();
</script>

<script>
document.addEventListener('click',function(e){const a=e.target.closest('a');if(a&&a.href&&a.href!==location.href+'#'&&!a.href.startsWith('javascript')&&!a.target){a.target='_blank';a.rel='noopener noreferrer';}});
</script>
</body>
</html>
