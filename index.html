<title>DC Dossier: A Generational Mid-term?</title>

<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,600;0,8..60,700;1,8..60,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2e;
  --navy-mid:#132640;
  --navy-light:#1a3050;
  --gold:#c9a84c;
  --gold-light:#e8c97a;
  --beige:#f0e8d6;
  --white:#ffffff;
  --t-muted:rgba(240,232,214,0.55);
  --br:rgba(201,168,76,0.18);
  --sans:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--navy);
  color:var(--beige);
  font-family:var(--sans);
  font-size:14px;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* HEADER */
.header{
  background:var(--navy);
  border-bottom:1px solid var(--br);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  height:60px;
  flex-shrink:0;
  position:relative;
  z-index:200;
}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{height:38px;width:38px;object-fit:contain;border-radius:4px;border:1px solid var(--br)}
.header-title{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--gold);letter-spacing:.01em;line-height:1.2}
.header-sub{font-size:11px;color:var(--t-muted);letter-spacing:.04em;margin-top:2px}
.header-right{text-align:right}
.countdown-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--t-muted);margin-bottom:4px}
.countdown-timer{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--gold-light);letter-spacing:.02em}
.countdown-sub{font-size:10px;color:var(--t-muted);margin-top:2px}

/* NAV TABS */
.nav-bar{
  background:var(--navy-mid);
  border-bottom:1px solid var(--br);
  display:flex;
  align-items:stretch;
  flex-shrink:0;
  overflow-x:auto;
  scrollbar-width:none;
  position:relative;
  z-index:190;
}
.nav-bar::-webkit-scrollbar{display:none}
.nav-tab{
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  color:var(--t-muted);
  background:none;
  border:none;
  border-bottom:2px solid transparent;
  padding:14px 24px;
  cursor:pointer;
  transition:color .12s,border-color .12s,background .12s;
  white-space:nowrap;
  flex-shrink:0;
}
.nav-tab:hover{color:var(--beige);background:var(--navy-light)}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--navy-light)}

/* IFRAME CONTAINER */
.frame-wrap{
  flex:1;
  overflow:hidden;
  position:relative;
}
.tab-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
  display:none;
  background:#ffffff;
}
.tab-frame.active{display:block}

/* LOADING INDICATOR */
.frame-loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--navy);
  flex-direction:column;
  gap:16px;
  pointer-events:none;
  opacity:0;
  transition:opacity .2s;
}
.frame-loading.visible{opacity:1}
.spinner{
  width:32px;height:32px;border-radius:50%;
  border:3px solid var(--br);
  border-top-color:var(--gold);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--t-muted);font-family:var(--serif);font-style:italic}

@media(max-width:600px){
  .header{padding:0 16px;height:54px}
  .header-title{font-size:14px}
  .nav-tab{padding:12px 14px;font-size:12px}
}
</style>

<script>
const ELECTION_DATE = new Date('2026-11-03T00:00:00');

function updateCountdown() {
  const now = new Date();
  const diff = ELECTION_DATE - now;
  if (diff <= 0) {
    document.getElementById('countdown-timer').textContent = 'Election Day';
    return;
  }
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  document.getElementById('countdown-timer').textContent =
    `${days}d ${hours}h ${mins}m`;
}

updateCountdown();
setInterval(updateCountdown, 30000);

function switchTab(name, btn) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.tab-frame').forEach(f => f.classList.remove('active'));
  const frame = document.getElementById('frame-' + name);
  frame.classList.add('active');

  // Lazy-load iframe src on first visit
  if (!frame.src || frame.src === window.location.href) {
    const lazySrc = frame.dataset.src;
    if (lazySrc) {
      const loader = document.getElementById('frame-loading');
      loader.classList.add('visible');
      frame.src = lazySrc;
      frame.onload = () => loader.classList.remove('visible');
    }
  }
}
</script>
